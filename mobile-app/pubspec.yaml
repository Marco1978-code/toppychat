name: toppychat
description: Chat privata solo per numeri autorizzati, con conversazioni salvate in locale.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.0
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_local_notifications: ^17.2.2
  flutter_foreground_task: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
