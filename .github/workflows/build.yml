name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android project if missing
        working-directory: mobile-app
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.marco.toppychat --project-name toppychat
          fi

      - name: Restore fixed debug keystore (per firmare l'APK sempre allo stesso modo)
        run: |
          mkdir -p ~/.android
          base64 -d mobile-app/ci/debug-keystore.base64 > ~/.android/debug.keystore

      - name: Enable core library desugaring (richiesto da flutter_local_notifications)
        working-directory: mobile-app
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            GRADLE_FILE=android/app/build.gradle.kts
            echo "" >> "$GRADLE_FILE"
            echo "android {" >> "$GRADLE_FILE"
            echo "    compileOptions {" >> "$GRADLE_FILE"
            echo "        isCoreLibraryDesugaringEnabled = true" >> "$GRADLE_FILE"
            echo "    }" >> "$GRADLE_FILE"
            echo "}" >> "$GRADLE_FILE"
            echo "" >> "$GRADLE_FILE"
            echo "dependencies {" >> "$GRADLE_FILE"
            echo "    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")" >> "$GRADLE_FILE"
            echo "}" >> "$GRADLE_FILE"
          elif [ -f android/app/build.gradle ]; then
            GRADLE_FILE=android/app/build.gradle
            echo "" >> "$GRADLE_FILE"
            echo "android {" >> "$GRADLE_FILE"
            echo "    compileOptions {" >> "$GRADLE_FILE"
            echo "        coreLibraryDesugaringEnabled true" >> "$GRADLE_FILE"
            echo "    }" >> "$GRADLE_FILE"
            echo "}" >> "$GRADLE_FILE"
            echo "" >> "$GRADLE_FILE"
            echo "dependencies {" >> "$GRADLE_FILE"
            echo "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'" >> "$GRADLE_FILE"
            echo "}" >> "$GRADLE_FILE"
          else
            echo "File build.gradle non trovato in android/app" >&2
            exit 1
          fi
          cat "$GRADLE_FILE"

      - name: Apply custom AndroidManifest
        working-directory: mobile-app
        run: cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Build APK
        working-directory: mobile-app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toppychat-apk
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk
